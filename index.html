  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Reward Box — USDT BEP20 Mini App</title>
    <meta
      name="description"
      content="Reward Box Telegram Mini App — Earn USDT BEP20 with sponsored ads, tasks, and referrals."
    />
    <meta property="og:title" content="Reward Box" />
    <meta
      property="og:description"
      content="Earn USDT BEP20 with sponsored ads, daily tasks, and referrals."
    />
    <meta property="og:type" content="website" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      (function () {
        var tg = window.Telegram && window.Telegram.WebApp;
        if (!tg || !tg.CloudStorage) return;
        var supported = typeof tg.isVersionAtLeast === 'function' && tg.isVersionAtLeast('6.9');
        if (supported) return;

        var memStore = {};
        var prefix = 'tg_cloud_fallback_';
        function readKey(k) {
          try {
            var v = window.localStorage.getItem(prefix + k);
            return v === null ? '' : v;
          } catch (e) {
            return Object.prototype.hasOwnProperty.call(memStore, k) ? memStore[k] : '';
          }
        }
        function writeKey(k, v) {
          try {
            window.localStorage.setItem(prefix + k, String(v));
          } catch (e) {
            memStore[k] = String(v);
          }
        }
        function deleteKey(k) {
          try {
            window.localStorage.removeItem(prefix + k);
          } catch (e) {
            delete memStore[k];
          }
        }
        function listKeys() {
          try {
            var out = [];
            for (var i = 0; i < window.localStorage.length; i++) {
              var k = window.localStorage.key(i);
              if (k && k.indexOf(prefix) === 0) out.push(k.slice(prefix.length));
            }
            return out;
          } catch (e) {
            return Object.keys(memStore);
          }
        }
        function notify(cb, err, val) {
          if (typeof cb === 'function') {
            setTimeout(function () {
              cb(err, val);
            }, 0);
          }
        }

        var cs = tg.CloudStorage;
        cs.setItem = function (key, value, callback) {
          writeKey(key, value);
          notify(callback, null, true);
          return cs;
        };
        cs.getItem = function (key, callback) {
          notify(callback, null, readKey(key));
          return cs;
        };
        cs.getItems = function (keys, callback) {
          var res = {};
          if (Array.isArray(keys)) {
            for (var i = 0; i < keys.length; i++) {
              res[keys[i]] = readKey(keys[i]);
            }
          }
          notify(callback, null, res);
          return cs;
        };
        cs.removeItem = function (key, callback) {
          deleteKey(key);
          notify(callback, null, true);
          return cs;
        };
        cs.removeItems = function (keys, callback) {
          if (Array.isArray(keys)) {
            for (var i = 0; i < keys.length; i++) {
              deleteKey(keys[i]);
            }
          }
          notify(callback, null, true);
          return cs;
        };
        cs.getKeys = function (callback) {
          notify(callback, null, listKeys());
          return cs;
        };
      })();
    </script>
    <script src="//libtl.com/sdk.js" data-zone="12118221" data-sdk="show_12118221"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

      rel="stylesheet"
    />
